# Default configuration for Gen-SHM
# Physics-informed Generative Surrogate for Drone Wing Structural Integrity

physics:
  # Beam geometry and material properties
  beam_length: 1.0        # meters
  beam_width: 0.1         # meters  
  beam_height: 0.02       # meters
  young_modulus: 70000000000.0  # 70 GPa (typical aluminum alloy)
  density: 2700.0         # kg/m³ (aluminum density)
  damping_coefficient: 10.0
  
  # Boundary conditions
  boundary_conditions:
    left: "clamped"       # x=0 (wing root)
    right: "free"         # x=L (wing tip)

damage:
  # Damage parameterization bounds
  min_severity: 0.0       # No damage
  max_severity: 0.5       # 50% stiffness reduction
  location_range: [0.1, 0.9]  # Avoid extreme boundaries
  damage_function: "gaussian"  # gaussian or step

model:
  # Neural network architecture
  input_dim: 4            # [x, t, damage_location, damage_severity]
  output_dim: 1           # displacement u(x,t)
  hidden_layers: 6
  hidden_dim: 128
  activation: "swish"     # swish, silu, relu, tanh
  dropout_rate: 0.0       # No dropout for physics problems

training:
  # Training hyperparameters
  epochs: 1000
  batch_size: 1024
  learning_rate: 0.001
  optimizer: "adam"       # adam, adamw, sgd
  lr_scheduler: "cosine_annealing"  # cosine_annealing, reduce_on_plateau
  
  # Loss function weights
  loss_weights:
    data: 1.0             # Calibration data fidelity
    physics: 10.0         # Physics equation satisfaction
    boundary: 100.0       # Boundary condition enforcement
  
  # Collocation point counts
  physics_points: 10000
  boundary_points: 1000
  initial_condition_points: 500

data:
  # Data generation parameters
  spatial_points: 100
  temporal_points: 200
  sensor_locations: [0.25, 0.5, 0.75]  # Normalized positions along wing
  noise_level: 0.01       # 1% measurement noise
  frequency_range: [10, 1000]  # Excitation frequency range (Hz)

paths:
  # Directory structure
  data_dir: "data/"
  checkpoints_dir: "checkpoints/"
  logs_dir: "logs/"
  results_dir: "results/"
  experiments_dir: "experiments/"

# Advanced training options
advanced:
  # Multi-scale training
  multiscale_training: true
  scale_epochs: 50
  max_scales: 4
  
  # Adaptive weighting
  adaptive_weighting: true
  weight_adaptation_rate: 0.01
  
  # Regularization
  l2_regularization: 1e-6
  physics_regularization: 0.01
  
  # Numerical stability
  gradient_clipping: 1.0
  numerical_tolerance: 1e-8

# Visualization settings
visualization:
  plot_training_progress: true
  save_plots: true
  plot_frequency: 50        # Plot every N epochs
  style: "seaborn-v0_8"

# Logging configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  save_to_file: true
  console_output: true